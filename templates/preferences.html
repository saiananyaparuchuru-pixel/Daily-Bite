
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Preferences | DailyBite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">DailyBite</a>

        <a href="{{ url_for('planner') }}"
           class="btn btn-light btn-sm">
            Weekly Planner
        </a>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <h1 class="fw-bold">Your Meal Preferences 🍽️</h1>

    <p class="text-muted">
        Tell us what you like so DailyBite can suggest suitable meals.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form action="{{ url_for('save_preferences') }}"
                  method="POST">

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        1. What type of food do you prefer?
                    </label>

                    <select name="food_type" class="form-select" required>

                        <option value="Both"
                            {% if preferences['food_type'] == 'Both' %}selected{% endif %}>
                            Both Vegetarian and Non-Vegetarian
                        </option>

                        <option value="Vegetarian"
                            {% if preferences['food_type'] == 'Vegetarian' %}selected{% endif %}>
                            Vegetarian
                        </option>

                        <option value="Non-Vegetarian"
                            {% if preferences['food_type'] == 'Non-Vegetarian' %}selected{% endif %}>
                            Non-Vegetarian
                        </option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        2. What is your maximum spending per meal?
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">₹</span>

                        <input type="number"
                               name="max_price"
                               class="form-control"
                               min="1"
                               step="0.01"
                               value="{{ preferences['max_price'] }}"
                               required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        3. Which meals do you prefer?
                    </label>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               name="breakfast"
                               value="1"
                               id="breakfast"
                               {% if preferences['breakfast'] %}checked{% endif %}>

                        <label class="form-check-label" for="breakfast">
                            Breakfast
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               name="lunch"
                               value="1"
                               id="lunch"
                               {% if preferences['lunch'] %}checked{% endif %}>

                        <label class="form-check-label" for="lunch">
                            Lunch
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               name="dinner"
                               value="1"
                               id="dinner"
                               {% if preferences['dinner'] %}checked{% endif %}>

                        <label class="form-check-label" for="dinner">
                            Dinner
                        </label>
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-success w-100">
                    Save My Preferences
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
